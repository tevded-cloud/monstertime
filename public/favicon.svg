<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- A horned creature head, drawn rather than typeset: an asymmetric pair of
       horns (deliberately uneven heights, because a matched pair reads as a
       logo and an uneven one reads as an animal), a rounded body, a single
       flicked tail, and one off-centre eye. Two flat colours, no gradient, no
       text, sized so the silhouette still separates from the eye at 16px. -->
  <polygon points="9,2 7,14 14,13" fill="#4b2e73" />
  <polygon points="23,1 17,13 25,14" fill="#4b2e73" />
  <polygon points="22,22 23,26 31,24" fill="#4b2e73" />
  <ellipse cx="16" cy="19" rx="11" ry="10" fill="#4b2e73" />
  <circle cx="20" cy="18" r="3" fill="#ffcb3d" />
</svg>
